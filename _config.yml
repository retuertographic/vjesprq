# Configuración de Jekyll (GitHub Pages lo compila automáticamente al hacer push a main)
title: Viajes Parque
description: Agencia de viajes en Tenerife con oficinas en Santa Cruz y Tegueste.
url: https://retuertographic.github.io
baseurl: /vjesprq   # vaciar ("") al volver a usar el dominio www.viajesparque.com
# Web provisional: pide a los buscadores que no la indexen. Quitar (o poner false) al publicar en el dominio.
noindex: true
lang: es
locale: es_ES
timezone: Atlantic/Canary

permalink: /diario-de-viaje/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /img/destinos/santorini.webp
  - scope:
      path: ""
      type: posts
    values:
      layout: articulo
      migas:
        - titulo: Diario de viaje
          url: /diario-de-viaje/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - herramientas
